<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MegaOpen UI</title>
<!--CSS-->
</head>
<body>
<div class="wrap">
<div id="app">
 <header>
  <a class="hb" id="back" href="#board" hidden>←</a>
  <div class="brand"><b>MegaOpen</b><small id="title"></small></div>
  <span class="sp"></span>
  <span class="chip bad" id="link" hidden></span>
  <button class="hb" id="langBtn" type="button" data-i18n-aria="m.lang"></button>
  <button class="hb" id="themeBtn" type="button" data-i18n-aria="m.theme">◐</button>
 </header>
 <div id="rbar" hidden>
  <div class="top"><span><span data-i18n="m.rbNeed"></span> · <span id="rbN"></span></span><button class="btn sm" id="rbGo" type="button" data-i18n="m.rbApply"></button></div>
  <div id="rbAsk" hidden><ul id="rbList"></ul><div class="top"><button class="btn sm dng" id="rbYes" type="button" data-i18n="m.rbYes"></button><button class="btn sm" id="rbUndo" type="button" data-i18n="m.rbUndo"></button><span id="rbMsg"></span></div></div>
 </div>
 <main id="main"></main>
 <div class="foot" id="foot">…</div>
 <nav class="tabs" id="tabs">
  <a href="#home" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span data-i18n="nav.home"></span></a>
  <a href="#screen" data-t="screen"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg><span data-i18n="nav.screen"></span></a>
  <a href="#keys" data-t="keys"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M3.5 10h6.5M14 10h6.5M12 14v7"/></svg><span data-i18n="nav.keys"></span></a>
  <a href="#car" data-t="car"><svg viewBox="0 0 24 24"><path d="M3 16v-3l2-5h14l2 5v3z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg><span data-i18n="nav.car"></span></a>
  <a href="#board" data-t="board"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span data-i18n="nav.board"></span></a>
  <a href="#service" data-t="service" id="tabSvc" hidden><svg viewBox="0 0 24 24"><path d="M14 7l3-3 3 3-3 3M4 20l9-9M7 4l2 2-3 3-2-2z"/></svg><span data-i18n="nav.service"></span></a>
 </nav>
</div>
</div>
<div id="boot" hidden><span data-i18n="m.booting"></span><b id="bootN">4</b><span id="bootWhy" style="font-size:14px;font-weight:600"></span></div>
<!--JS-->
</body>
</html>
