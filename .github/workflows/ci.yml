# Host tests, the three board builds and the repo checks, on every push to
# master and every pull request. The same gate a slice passes locally.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLATFORMIO_VERSION: "6.1.19"

jobs:
  native:
    name: host tests + rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # .gitattributes stores text as LF; a file committed with CR anyway
      # (core.autocrlf=false) broke release.yml's version parse once.
      - name: no CR in tracked files
        run: |
          bad=$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed" { print $NF }')
          [ -z "$bad" ] || { echo "::error::stored with CR (git add --renormalize):"; echo "$bad"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-native-
      - run: pip install "platformio==${PLATFORMIO_VERSION}"
      # env:native compiles with the host's own gcc/g++, not a PlatformIO
      # toolchain: ubuntu-24.04 ships one. On Windows install w64devkit or
      # MSYS2 MinGW and put its bin on PATH (README, Build).
      - name: pio test -e native
        run: pio test -e native
      - name: check_rules
        run: python tools/check_rules.py
      - name: check_i18n
        run: python tools/check_i18n.py
      # catalog.json, features.json and decode.json for check_nav and build_sim.
      - uses: actions/upload-artifact@v7
        with:
          name: native-build
          path: build/
          if-no-files-found: error

  firmware:
    name: build ${{ matrix.env }}
    needs: native
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [t2can, t2can_usbhid, direct]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-
      - run: pip install "platformio==${PLATFORMIO_VERSION}"
      - uses: actions/download-artifact@v8
        with:
          name: native-build
          path: build/
      - name: pio run -e ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      # A build writes only untracked files (src/net/gen/, build/): anything
      # it changed in git would also stamp the image "-dirty".
      - name: the build left the tree clean
        run: git diff --exit-code --stat
      - name: check_nav
        run: python tools/check_nav.py ${{ matrix.env }}
      - name: check_pages
        run: python tools/check_pages.py
      - uses: actions/upload-artifact@v7
        with:
          name: features-${{ matrix.env }}
          path: build/features/${{ matrix.env }}.json
          if-no-files-found: error

  sim:
    name: UI simulator
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: native-build
          path: build/
      - uses: actions/download-artifact@v8
        with:
          pattern: features-*
          path: build/features/
          merge-multiple: true
      - name: build_sim
        run: python tools/build_sim.py
      - uses: actions/upload-artifact@v7
        with:
          name: ui-sim
          path: build/ui-sim.html

  # The web app at phone width (390/360 px, light and dark, every tab) in the
  # runner's headless Chrome: fails on page overflow, text contrast under
  # 4.5:1, a control's hit area under 40 px, and any console error (the mock
  # logs a change sent without X-MegaOpen as one). tools/ui_audit.mjs; the
  # failing pages' screenshots are kept as an artifact.
  ui:
    name: UI at phone width
    needs: sim
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: ui-sim
          path: build/
      - name: Chrome
        run: google-chrome --version
      - name: ui_audit
        env:
          CHROME: google-chrome
        run: node tools/ui_audit.mjs build/ui-sim.html build/ui-audit
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-audit
          path: build/ui-audit/

  # tools/rc_smoke.sh against the simulator's mock (tools/sim_http.mjs serves
  # it over HTTP from headless Chrome): the replies the smoke test expects and
  # the ones the mock gives must agree, so a renamed code or a dropped field
  # fails here and not on the rc's board. --sim skips, by name, the checks only
  # the firmware can pass; anything else fails the job.
  smoke:
    name: rc_smoke against the mock
    needs: sim
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: ui-sim
          path: build/
      - name: rc_smoke --sim
        env:
          CHROME: google-chrome
        run: |
          node tools/sim_http.mjs build/ui-sim.html 8077 t2can &
          for i in $(seq 1 60); do curl -s -m 2 http://127.0.0.1:8077/api/status > /dev/null && break; sleep 1; done
          bash tools/rc_smoke.sh --sim http://127.0.0.1:8077
