; MegaOpen — see README.md and ARCHITECTURE.md.
;
;   t2can         LilyGO T-2CAN (ESP32-S3): the panel on CAN B, the car on CAN A.
;                 The board in the car, and the default.
;   t2can_usbhid  t2can with the USB HID keyboard on; a compile check.
;   devkit        ESP32 DevKit V1: the panel on its one TWAI port, the car's
;                 frames over a UART from board V.
;   boardv        ESP32-C3 on the car's OBD2 CAN, feeding devkit over the link.
;   direct        DevKit with no panel: the six-wire key matrix and the KEY1/KEY2
;                 ladder.
;   native        host tests (`pio test -e native`).
[platformio]
default_envs = t2can

[common]
; AffaDisplay's gates. Its AffaConfig.h only supplies defaults and #errors when
; no panel is named.
affa_flags =
	-D AFFA_PANEL_CARMINAT=1
	-D AFFA_PANEL_UPDATELIST=1
	-D AFFA_PANEL_UPDATELIST_MENU=1
	; The menu widget is not used: we draw with showMenu() and highlightItem(),
	; which are there regardless.
	-D AFFA_ENABLE_MENU=0
	-D AFFA_ENABLE_LOG=1
	-D AFFA_LOG_LEVEL=3
	; The 48x48 pane on 0x1F1 (src/display/MediaPane.*).
	-D AFFA_ENABLE_NAV=1
	; showMenuN(): nothing here draws a list longer than two rows.
	-D AFFA_ENABLE_BIGMENU=0

; Which of the library's own CAN links is compiled. The panel does not use
; either: it runs on src/display/TwaiAffaLink.h over our TwaiBus (rxq 64).
; CanCommonLink is still compiled on the target; never both, since that would
; be two owners of one controller. The host build has neither.
affa_link_target =
	-D AFFA_ENABLE_CANCOMMON_LINK=1
	-D AFFA_ENABLE_ESP32CAN_LINK=0
affa_link_host =
	-D AFFA_ENABLE_CANCOMMON_LINK=0
	-D AFFA_ENABLE_ESP32CAN_LINK=0

; AffaDisplay: v1.0.0 plus the Carminat registration fix (2e40bb9, branch
; carminat-peerchannel-probe). The firmware and the host tests use the same pin.
affa_lib = https://github.com/Barbedx/AffaDisplay.git#2e40bb97ae95cb7239912b9c4f674d1c3e2a55be

; ---------------------------------------------------------------------------
; Everything the ESP32 envs share.
; ---------------------------------------------------------------------------
[target]
; Pinned: the platform decides the Arduino core (arduino-esp32 2.0.17, IDF 4.4)
; and the prebuilt sdkconfig the timing rests on. Move it on purpose.
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, log2file
; gen_pages.py gzips web/ into src/net/gen/PageGz.cpp; version.py stamps the
; git hash and build time into src/Version.cpp.
extra_scripts = pre:tools/gen_pages.py, pre:tools/version.py
; Exact versions everywhere; ElegantOTA's psychic-http branch by commit.
lib_deps =
	hoeken/PsychicHttp@1.2.1
	https://github.com/ayushsharma82/ElegantOTA.git#e2c2aee15e9f71ed35415cc02f0b10b53b2c195c
	bblanchon/ArduinoJson@7.4.3
	h2zero/NimBLE-Arduino@2.5.1
	${common.affa_lib}
	; Declared here, not by the library: AffaDisplay stopped declaring it so
	; that a consumer with its own link does not get a second CAN driver.
	; Same pins as the library's examples.
	collin80/can_common@0.4.0
	https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
; chain+ evaluates #if while scanning, which keeps the disabled link's
; <driver/twai.h> include out.
lib_ldf_mode = chain+
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	; Nothing here throws; no unwind tables saves ~70 kB of flash.
	-fno-exceptions
	-D ELEGANTOTA_USE_PSYCHIC=1
	${common.affa_flags}
	${common.affa_link_target}
	; Feature switches: src/Features.h. Which bus the one TWAI controller serves
	; is a setting read at boot (src/bus/CanRole.h).
	-D FEATURE_DISPLAY_CAN=1
	-D FEATURE_VEHICLE_CAN=1   ; listen-only sniffer and /api/can, never transmits
	-D FEATURE_MATRIX=0
	-D FEATURE_BLE=1
	-D FEATURE_ANCS=1
	; Knobs and LED rings; every part is off in NVS until enabled in the UI.
	-D FEATURE_KNOBS=1
	-D USE_NIMBLE
	; Two links: the iPhone (AMS/CTS client) and optionally the head unit on
	; our HID service.
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
	-D CONFIG_BT_NIMBLE_MAX_BONDS=4
board_build.filesystem = littlefs
board_build.partitions = partitions_ota.csv

; ---------------------------------------------------------------------------
; LilyGO T-2CAN(-FD): ESP32-S3-WROOM-1U N16R8, two isolated CAN ports.
; CAN B (the S3's TWAI, GPIO7/6) is the panel; CAN A (MCP2518FD on SPI) is the
; car, listen-only. Pins: src/board/BoardProfile.h.
; N16R8 = quad flash + octal PSRAM, hence qio_opi; GPIO33-37 belong to it.
; First flash over the Type-C (hold BOOT if it will not enter download mode).
; ---------------------------------------------------------------------------
[env:t2can]
extends = target
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_ota_16mb.csv
; The board file's flags minus its -DARDUINO_USB_MODE=1, so the one below is
; the only one. The core's event task goes to core 0 with WiFi, so nothing
; sits above the keys on core 1 (src/app/TaskPlan.h).
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=0
lib_deps =
	${target.lib_deps}
	pierremolinaro/ACAN2517FD@2.1.16
build_flags =
	${target.build_flags}
	-D BOARD_HAS_PSRAM
	-D FEATURE_CAN2=1
	; Keys go over the Raise UART. For the USB keyboard see env:t2can_usbhid:
	; FEATURE_USB_HID=1 needs ARDUINO_USB_MODE=0 (TinyUSB, CDC + HID).
	-D FEATURE_USB_HID=0
	; The log on flash (/log, 2 MB of littlefs), written in 16 kB bursts on
	; warnings and before a reboot, never on a timer (src/utils/LogFile.h).
	-D FEATURE_LOGFS=1
	; CAN capture to /cap (src/capture/CanRecorder.h, tools/can_dump.py).
	-D FEATURE_CAPTURE=1
	-D LOGBUS_RING=32768
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

; t2can with the USB HID keyboard on. The flag list is written out rather than
; inherited plus overrides: two -D's for one macro is an order-dependent winner.
[env:t2can_usbhid]
extends = env:t2can
build_flags =
	${target.build_flags}
	-D BOARD_HAS_PSRAM
	-D FEATURE_CAN2=1
	-D FEATURE_USB_HID=1
	-D FEATURE_LOGFS=1
	-D FEATURE_CAPTURE=1
	-D LOGBUS_RING=32768
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; ESP32 DevKit V1 (WROOM-32), transceiver on CRX=GPIO5 / CTX=GPIO4.
; ---------------------------------------------------------------------------
[env:devkit]
extends = target
board = esp32dev
upload_speed = 921600
build_flags =
	${target.build_flags}
	; The car's frames from board V over UART2 on D26/D27 (src/link/).
	-D FEATURE_LINK=1
	; Any AffaDisplay call from a task other than the panel's owner aborts with
	; the caller in the backtrace (src/app/PanelOwner.h).
	-D AFFA_OWNER_ASSERT=1

; ---------------------------------------------------------------------------
; No panel: the keypad's six wires to the GPIO matrix, and the head unit driven
; over the Raise UART and the analog KEY1/KEY2 lines. No BLE. The library and
; both CAN wrappers come out with the panel.
; ---------------------------------------------------------------------------
[env:direct]
extends = env:devkit
lib_deps =
	hoeken/PsychicHttp@1.2.1
	https://github.com/ayushsharma82/ElegantOTA.git#e2c2aee15e9f71ed35415cc02f0b10b53b2c195c
	bblanchon/ArduinoJson@7.4.3
lib_ignore = AffaDisplay, ESP32_CAN, esp32_can, can_common, NimBLE-Arduino
build_flags =
	-std=gnu++17
	-fno-exceptions
	-D ELEGANTOTA_USE_PSYCHIC=1
	-D FEATURE_DISPLAY_CAN=0
	-D FEATURE_MATRIX=1
	-D FEATURE_CANBOX_UART=1
	-D FEATURE_VEHICLE_CAN=1
	-D FEATURE_RESISTIVE_KEYS=1
	-D FEATURE_BLE=0
	-D FEATURE_ANCS=0
build_src_filter =
	+<*>
	-<display/>
	-<media/AmsMediaSource.cpp>
	-<bluetooth.cpp> -<apple_media_service.cpp> -<apple_notification_service.cpp>
	-<current_time_service.cpp> -<ble/> -<sinks/BleKeySinks.cpp>
	-<keys/AffaKeySource.cpp> -<keys/AffaMap.cpp>

; ---------------------------------------------------------------------------
; Board V: ESP32-C3 + SN65HVD230 on the car's OBD2 CAN (pins 6 and 14; the
; car's bus is already terminated, so no 120 ohm on the board). Listen-only:
; forwards raw frames up a UART to the DevKit and takes a filter back.
; src/LinkMain.cpp is the whole program.
;
;     GPIO3  <--  CRX      GPIO4  -->  CTX (never driven: listen-only)
;     GPIO21 -->  DevKit GPIO26      GPIO20 <--  DevKit GPIO27      921600 8N1
; ---------------------------------------------------------------------------
[env:boardv]
platform = espressif32@6.13.0
framework = arduino
board = esp32-c3-devkitm-1
upload_speed = 115200
monitor_speed = 115200
lib_deps =
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-fno-exceptions
	-D MEGAOPEN_BOARDV=1
	-D FEATURE_DISPLAY_CAN=0
	-D FEATURE_VEHICLE_CAN=0
	-D FEATURE_MATRIX=0
	-D FEATURE_CANBOX_UART=0
	-D FEATURE_BLE=0
	-D FEATURE_ANCS=0
	-D FEATURE_KNOBS=0
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
	+<LinkMain.cpp>
	+<bus/TwaiBus.cpp>
	+<link/LinkProto.cpp>

; ---------------------------------------------------------------------------
; Host tests. Only the portable parts of src/ are built (the filter below);
; anything touching FreeRTOS, RMT or the radio stays on the target.
; test_catalog also writes build/catalog.json for the UI simulator.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
	${common.affa_lib}
	bblanchon/ArduinoJson@7.4.3
; The library declares frameworks=arduino; its core/, util/ and proto/ compile
; on the host against the C++17 standard library alone, so the check is off.
lib_compat_mode = off
lib_ldf_mode = chain+
lib_ignore = ESP32_CAN, esp32_can, can_common
build_flags =
	-std=gnu++17
	-D MEGAOPEN_NATIVE=1
	; utils/Log.h swaps Arduino for header-only stubs on this guard.
	-D NATIVE=1
	${common.affa_flags}
	${common.affa_link_host}
	-I src
build_src_filter = +<input/> +<keys/> +<proto/> +<vehicle/> +<sinks/CanboxUartSink.cpp> +<sinks/ResistiveLadder.cpp> +<sinks/ResistiveMap.cpp> +<sinks/ResistiveKeySink.cpp> +<display/MediaScreen.cpp> +<display/MediaPane.cpp> +<media/HuMediaSource.cpp> +<media/MediaRouter.cpp> +<knobs/KnobConfig.cpp> +<knobs/KnobSource.cpp> +<knobs/KnobLights.cpp> +<link/LinkProto.cpp> +<app/RequestReply.cpp> +<app/TxGate.cpp> +<app/MailboxIds.cpp> +<capture/CapFormat.cpp> +<bus/Autobaud.cpp> +<bus/TwaiVehicleSource.cpp> +<net/Catalog.cpp> +<utils/LogRing.cpp>
