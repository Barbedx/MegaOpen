; MegaOpen — see README.md and ARCHITECTURE.md.
;
;   t2can         LilyGO T-2CAN (ESP32-S3): the panel on CAN B, the car on CAN A.
;                 The board in the car, and the default.
;   t2can_usbhid  t2can with the USB HID keyboard on; a compile check.
;   direct        ESP32 DevKit V1 with no panel: the six-wire key matrix and the KEY1/KEY2
;                 ladder.
;   native        host tests (`pio test -e native`).
[platformio]
default_envs = t2can

[common]
; AffaDisplay's gates. Its AffaConfig.h only supplies defaults and #errors when
; no panel is named.
affa_flags =
	-D AFFA_PANEL_CARMINAT=1
	-D AFFA_PANEL_UPDATELIST=1
	-D AFFA_ENABLE_LOG=1
	-D AFFA_LOG_LEVEL=3
	; The 48x48 pane on 0x1F1 (src/display/MediaPane.*).
	-D AFFA_ENABLE_NAV=1
	; showMenuN(): nothing here draws a list longer than two rows.
	-D AFFA_ENABLE_BIGMENU=0
	; The loop task owns poll() (src/app/PanelOwner.*): it sleeps in the link's
	; waitRx() as AffaTask would, and the same pass runs the work around poll()
	; that AffaTask has no hook for. Renders from other tasks still cross
	; through the library's dispatch ring: that needs the poll owner declared.
	-D AFFA_ENABLE_TASK=0

; AffaDisplay by release tag: the panel's TWAI link (affa::TwaiLink, rxq 64,
; TX gate) and render-from-any-task are the library's. The firmware and the
; host tests use the same pin. Moving it is a commit here, so every MegaOpen
; release names the library it was built with.
affa_lib = https://github.com/Barbedx/AffaDisplay.git#v1.1.1

; ---------------------------------------------------------------------------
; Everything the ESP32 envs share.
; ---------------------------------------------------------------------------
[target]
; Pinned: the platform decides the Arduino core (arduino-esp32 2.0.17, IDF 4.4)
; and the prebuilt sdkconfig the timing rests on. Move it on purpose.
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, log2file
; gen_pages.py gzips web/ into src/net/gen/PageGz.cpp; version.py stamps the
; git hash and build time into src/Version.cpp; factory_bin.py adds the
; `factory` target (one bin for a first USB flash at 0x0).
extra_scripts = pre:tools/gen_pages.py, pre:tools/version.py, pre:tools/short_includes.py, post:tools/factory_bin.py
; Exact versions everywhere; ElegantOTA's psychic-http branch by commit.
lib_deps =
	hoeken/PsychicHttp@1.2.1
	https://github.com/ayushsharma82/ElegantOTA.git#e2c2aee15e9f71ed35415cc02f0b10b53b2c195c
	bblanchon/ArduinoJson@7.4.3
	h2zero/NimBLE-Arduino@2.5.1
	${common.affa_lib}
; chain+ evaluates #if while scanning: an include a build #ifs out pulls in no
; library.
lib_ldf_mode = chain+
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	; Nothing here throws; no unwind tables saves ~70 kB of flash.
	-fno-exceptions
	-D ELEGANTOTA_USE_PSYCHIC=1
	${common.affa_flags}
	; Feature switches: src/Features.h. The TWAI controller serves the panel when
	; FEATURE_DISPLAY_CAN is on, else the car (src/bus/TwaiVehicleSource.h).
	-D FEATURE_DISPLAY_CAN=1
	-D FEATURE_VEHICLE_CAN=1   ; listen-only sniffer and /api/can, never transmits
	-D FEATURE_MATRIX=0
	-D FEATURE_BLE=1
	-D FEATURE_ANCS=1
	; Knobs and LED rings; every part is off in NVS until enabled in the UI.
	-D FEATURE_KNOBS=1
	-D USE_NIMBLE
	; Two links: the iPhone (AMS/CTS client) and optionally the head unit on
	; our HID service.
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
	-D CONFIG_BT_NIMBLE_MAX_BONDS=4
board_build.filesystem = littlefs
board_build.partitions = partitions_ota.csv

; ---------------------------------------------------------------------------
; LilyGO T-2CAN(-FD): ESP32-S3-WROOM-1U N16R8, two isolated CAN ports.
; CAN B (the S3's TWAI, GPIO7/6) is the panel; CAN A (MCP2518FD on SPI) is the
; car, listen-only. Pins: src/board/BoardProfile.h.
; N16R8 = quad flash + octal PSRAM, hence qio_opi; GPIO33-37 belong to it.
; First flash over the Type-C (hold BOOT if it will not enter download mode).
; ---------------------------------------------------------------------------
[env:t2can]
extends = target
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_ota_16mb.csv
; The board file's flags minus its -DARDUINO_USB_MODE=1, so the one below is
; the only one. The core's event task goes to core 0 with WiFi, so nothing
; sits above the keys on core 1 (src/app/TaskPlan.h).
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=0
lib_deps =
	${target.lib_deps}
	pierremolinaro/ACAN2517FD@2.1.16
build_flags =
	${target.build_flags}
	-D BOARD_HAS_PSRAM
	-D FEATURE_CAN2=1
	; Keys go over the Raise UART. For the USB keyboard see env:t2can_usbhid:
	; FEATURE_USB_HID=1 needs ARDUINO_USB_MODE=0 (TinyUSB, CDC + HID).
	-D FEATURE_USB_HID=0
	; The log on flash (/log, 2 MB of littlefs), written in 16 kB bursts on
	; warnings and before a reboot, never on a timer (src/utils/LogFile.h).
	-D FEATURE_LOGFS=1
	; CAN capture to /cap (src/capture/CanRecorder.h, tools/can_dump.py).
	-D FEATURE_CAPTURE=1
	; Updates from GitHub Releases, from the Плата page (src/net/GhOta.h).
	-D FEATURE_GH_OTA=1
	-D LOGBUS_RING=32768
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

; t2can with the USB HID keyboard on. The flag list is written out rather than
; inherited plus overrides: two -D's for one macro is an order-dependent winner.
[env:t2can_usbhid]
extends = env:t2can
build_flags =
	${target.build_flags}
	-D BOARD_HAS_PSRAM
	-D FEATURE_CAN2=1
	-D FEATURE_USB_HID=1
	-D FEATURE_LOGFS=1
	-D FEATURE_CAPTURE=1
	; Updates from GitHub Releases, from the Плата page (src/net/GhOta.h).
	-D FEATURE_GH_OTA=1
	-D LOGBUS_RING=32768
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; ESP32 DevKit V1 (WROOM-32), no panel: the keypad's six wires to the GPIO
; matrix, and the head unit driven over the Raise UART and the analog KEY1/KEY2
; lines. The TWAI (CRX=GPIO5 / CTX=GPIO4) is a listen-only car sniffer on
; AffaDisplay's link alone (<AffaTwai.h>, no panel flag, no display). No BLE.
; ---------------------------------------------------------------------------
[env:direct]
extends = target
board = esp32dev
upload_speed = 921600
lib_deps =
	hoeken/PsychicHttp@1.2.1
	https://github.com/ayushsharma82/ElegantOTA.git#e2c2aee15e9f71ed35415cc02f0b10b53b2c195c
	bblanchon/ArduinoJson@7.4.3
	${common.affa_lib}
lib_ignore = NimBLE-Arduino
build_flags =
	-std=gnu++17
	-fno-exceptions
	-D ELEGANTOTA_USE_PSYCHIC=1
	; The link only: no panel, no owned task.
	-D AFFA_ENABLE_TASK=0
	; The link's log goes to the LogBus via affa::setLogSink (main.cpp).
	-D AFFA_ENABLE_LOG=1
	-D FEATURE_DISPLAY_CAN=0
	-D FEATURE_MATRIX=1
	-D FEATURE_CANBOX_UART=1
	-D FEATURE_VEHICLE_CAN=1
	-D FEATURE_RESISTIVE_KEYS=1
	-D FEATURE_BLE=0
	-D FEATURE_ANCS=0
build_src_filter =
	+<*>
	-<display/>
	-<media/AmsMediaSource.cpp>
	-<bluetooth.cpp> -<apple_media_service.cpp> -<apple_notification_service.cpp>
	-<current_time_service.cpp> -<ble/> -<sinks/BleKeySinks.cpp>
	-<keys/AffaKeySource.cpp> -<keys/AffaMap.cpp>

; ---------------------------------------------------------------------------
; Host tests. Only the portable parts of src/ are built (the filter below);
; anything touching FreeRTOS, RMT or the radio stays on the target.
; test_catalog also writes build/catalog.json for the UI simulator.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
	${common.affa_lib}
	bblanchon/ArduinoJson@7.4.3
; The library declares frameworks=arduino; its core/, util/ and proto/ compile
; on the host against the C++17 standard library alone, so the check is off.
lib_compat_mode = off
lib_ldf_mode = chain+
build_flags =
	-std=gnu++17
	-D MEGAOPEN_NATIVE=1
	; utils/Log.h swaps Arduino for header-only stubs on this guard.
	-D NATIVE=1
	${common.affa_flags}
	-I src
build_src_filter = +<input/> +<keys/> +<proto/> +<vehicle/> +<sinks/CanboxUartSink.cpp> +<sinks/ResistiveLadder.cpp> +<sinks/ResistiveMap.cpp> +<sinks/ResistiveKeySink.cpp> +<display/MediaScreen.cpp> +<display/MediaPane.cpp> +<media/HuMediaSource.cpp> +<media/MediaRouter.cpp> +<knobs/KnobConfig.cpp> +<knobs/KnobSource.cpp> +<knobs/KnobLights.cpp> +<app/RequestReply.cpp> +<app/OtaVerdict.cpp> +<app/UiWaits.cpp> +<capture/CapFormat.cpp> +<bus/Autobaud.cpp> +<bus/TwaiVehicleSource.cpp> +<net/Catalog.cpp> +<net/GhRelease.cpp> +<cfg/SettingsRegistry.cpp> +<cfg/SettingsJson.cpp> +<ui/> +<utils/LogRing.cpp>
